<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#39735d"><title>英语岛大冒险 · 方块世界</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#264736;background:#e5f1db}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#98d8ef 0 230px,#e5f1db 230px)}button,textarea,select{font:inherit}button{cursor:pointer}header{padding:20px 16px 40px;background:linear-gradient(160deg,#80d0fa,#b2e6ea 70%,#6da95d 71%,#5c9850);border-bottom:9px solid #685b3e}header .wrap{max-width:1100px;margin:auto}h1{font-size:clamp(27px,5vw,46px);margin:2px 0;color:#174c46;text-shadow:2px 2px #fff8}h2{font-size:24px;margin:8px 0}h3{margin:8px 0}p{line-height:1.7}main{max-width:1100px;margin:-24px auto 50px;padding:0 12px;position:relative}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 15px}.nav button,.btn{border:2px solid #44856d;background:#f8fff2;color:#205445;padding:11px 14px;border-radius:11px;font-weight:750;box-shadow:0 3px 0 #b0ccb4}.nav button.active,.btn.primary{background:#266d56;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.card{background:#fffef7;border:2px solid #a6cfa7;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 5px 0 #c9dcc1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}.tile{text-align:left;display:block;width:100%;border:2px solid #74a687;border-radius:14px;background:#f1fff0;color:#245540;padding:16px;min-height:150px;box-shadow:0 5px #bad3ae}.tile:hover{transform:translateY(-2px)}.tile b{display:block;font-size:18px;margin:8px 0}.tile small{color:#657969}.sprite{font-size:43px}.meta{display:inline-block;background:#fff0b8;color:#77520d;padding:4px 9px;border-radius:22px;font-weight:bold;font-size:12px}.stage{background:linear-gradient(#9ddbf8 0 67%,#7bbf70 67% 78%,#a27145 78%);border:4px solid #438e75;border-radius:15px;padding:24px 16px;min-height:140px;display:flex;align-items:center;gap:20px}.stage .npc{font-size:68px;border:0;background:none;animation:bob 3s infinite}.stage span{background:#fffcde;border:2px solid #619977;border-radius:13px;padding:10px 16px}.option{width:100%;padding:14px;margin:5px 0;text-align:left;border:2px solid #bdceb7;background:#f9fff8;border-radius:11px;color:#274e3b}.option.good{background:#ddf8d8;border-color:#499e69}.option.bad{background:#ffe6d9;border-color:#d57358}.reader{max-height:290px;overflow:auto;border:1px solid #b7d3be;border-radius:12px;padding:6px 12px}.line{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed #d2dfd0}.line strong{min-width:68px;color:#28705e}.line span{flex:1}.line button{border:1px solid #acc8bb;border-radius:9px;padding:7px;background:#f4fff3}.line.mark{background:#fff2b8}.progress{background:#e0e8df;height:13px;border-radius:10px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:#53b96c}.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:2px dashed #91b398;border-radius:10px;margin:10px 0}.chips button{padding:9px;border-radius:10px;border:1px solid #6da783;background:#def5dc}.note{background:#eef8ed;padding:12px;border-left:5px solid #5ca96d;border-radius:8px}.err{background:#fff2e5;border-color:#e3a044}textarea{width:100%;min-height:90px;padding:10px;border:2px solid #acccab;border-radius:9px}.word{border:1px solid #cae0ca;border-radius:11px;padding:10px;background:#f7fff6}.voice-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}.voice-controls label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:650}.voice-controls select{max-width:100%;min-width:0;padding:10px;border:1px solid #81aa88;border-radius:9px;background:white;color:#254d3c}.word b{font-size:20px}.word small{display:block;color:#668275}footer{padding:25px;text-align:center;color:#53665b;font-size:12px}@keyframes bob{50%{transform:translateY(-9px)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:11px}.card{padding:12px}.line strong{min-width:48px;font-size:12px}.stage .npc{font-size:53px}}@media(prefers-reduced-motion:reduce){.stage .npc{animation:none}}</style></head><body>
<header><div class="wrap"><span class="meta">🧱 方块世界 · 在线学习游戏</span><h1>🏝️ 英语岛大冒险</h1><p>12单元 × 60分 · 每日15词 · 动物对话 · 阅读挑战 · 错题二刷</p></div></header>
<main><nav class="nav" id="nav"></nav><section id="app"></section></main><footer>英语岛学习游戏 · 本地浏览器保存学习进度 · 原创练习</footer><script src="data.js"></script><script src="voice.js"></script><script>
(()=>{'use strict';const DATA=window.ISLAND_DATA;const KEY='english-island-online-v1';const defaultState=()=>({unit:{},stories:{},wrong:[],words:{},day:{},draft:{},history:[]});let state=defaultState();try{state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}let tab='home',mode=null,run=null,answer=null,selected=[],cn=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const speak=s=>{if(window.IslandSpeech)window.IslandSpeech.speak(s);else if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}};const voicePanel=()=>window.IslandSpeech?.panel()||'<p>语音设置未加载，请刷新页面后重试。</p>';const today=()=>new Date().toLocaleDateString('sv-SE');const btn=(text,act,extra='')=>'<button class="btn" data-a="'+act+'" '+extra+'>'+text+'</button>';const menu=[['home','🗺️ 岛屿地图'],['words','💎 每日15词'],['story','🐾 动物阅读'],['review','🔁 复习仓库'],['growth','📊 成长记录']];function nav(){$('#nav').innerHTML=menu.map(([id,t])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+t+'</button>').join('')}function home(){return '<div class="card"><h2>🧭 12单元学习地图</h2><p>每个单元8题，先做必会记忆点，再识别易错陷阱。完成本单元后显示60分制成绩；错题可二刷。</p><div class="grid">'+DATA.units.map((u,i)=>'<button class="tile" data-open-unit="'+i+'"><span class="sprite">'+u[4]+'</span><b>'+(i+1)+'. '+esc(u[1])+'</b><small>'+esc(u[0])+'</small><p class="meta">最高 '+(state.unit[i]??0)+'/60分</p></button>').join('')+'</div></div><div class="card"><h2>🐻 方块故事任务工坊</h2><p>12篇动物情景对话；每篇包含词义理解、阅读信息、连词成句和事件排序。</p>'+btn('打开动物阅读馆','story','class="primary"')+'</div>'}function unitPanel(id){let u=DATA.units[id];return '<div class="card"><h2>'+u[4]+' '+esc(u[0])+' · '+esc(u[1])+'</h2><p class="note">⭐ 必会：'+esc(u[2])+'</p><p class="note err">⚠️ 易错：'+esc(u[3])+'</p><p>词汇点读：点击英文词语即可朗读。</p>'+voicePanel()+'<div class="grid">'+u[5].split(',').map(x=>{let [en,zh]=x.split('=');return '<button class="word" data-say="'+esc(en)+'"><b>'+esc(en)+'</b><small>'+esc(zh)+'</small></button>'}).join('')+'</div><p style="margin-top:14px">'+btn('▶ 开始60分单元挑战','startunit','data-id="'+id+'"')+' '+btn('返回地图','back')+'</p></div>'}function storyHome(){return '<div class="card"><h2>🐾 动物阅读馆</h2><p>每篇原创情境故事包含英语点读、中文解释、8题阅读练习、连词成句与事件顺序题。</p><div class="grid">'+DATA.stories.map((s,i)=>'<button class="tile" data-open-story="'+i+'"><span class="sprite">'+s[1]+'</span><b>'+esc(s[0])+'</b><small>'+esc(s[2])+'</small><p class="meta">最高 '+(state.stories[i]??0)+'/30分</p></button>').join('')+'</div></div>'}function reader(s,mark=-1){return '<div class="card"><h3>📖 故事原文</h3><div class="reader">'+s[3].map((x,i)=>'<div class="line '+(mark===i?'mark':'')+'"><strong>'+esc(x[0])+'</strong><span>'+esc(x[1])+(cn?'<small style="display:block;color:#687c66">'+esc(x[2])+'</small>':'')+'</span><button data-read="'+i+'">🔊</button></div>').join('')+'</div><p>'+btn('🔊 朗读全文','readall')+' '+btn(cn?'隐藏中文':'显示中文','togglecn')+'</p></div>'}function storyPanel(id){let s=DATA.stories[id];return '<div class="card"><div class="stage"><button class="npc" data-a="npc">'+s[1]+'</button><span><b>'+esc(s[2])+'</b><br>点击动物，听它说英语！</span></div><h2>'+esc(s[0])+'</h2><p>基础理解→语法辨析→句子重组→事件排序。通关之后记得大声朗读完整故事。</p>'+btn('开始阅读闯关','startstory','data-id="'+id+'"')+' '+btn('返回阅读馆','story')+'</div>'+reader(s)+voicePanel()+'<div class="card"><h3>✍️ 阅读后表达</h3><p>根据故事写2—3句英语，说说角色做了什么或你喜欢谁。</p><textarea id="draft">'+esc(state.draft[id]||'')+'</textarea>'+btn('保存英语小作文','saveDraft')+'<p><small>开放表达不自动评分，建议老师或家长批阅。</small></p></div>'}function unitQuestions(id){let u=DATA.units[id];return u[6].map((q,i)=>({q:q[0],options:q[1].split('|'),answer:q[2],why:q[3],id:'u'+id+'_'+i,tier:i<3?'必会快测':i<6?'母题变式':'★★易错综合'}))}function storyQuestions(id){let s=DATA.stories[id];let q=s[4].map((x,i)=>({q:x[0],options:x[1].split('|'),answer:x[2],why:'请看故事原文中的相关句子。',evidence:x[3],id:'s'+id+'_'+i,tier:i<3?'基础理解':i<6?'进阶迁移':'★★阅读挑战'}));const t=s[5].split(' ');const scrambled=t.map((_,i)=>i).reverse();q.push({q:'连词成句：按顺序点击词块，组成完整的句子。',tokens:scrambled.map(i=>t[i]),order:scrambled.map((_,i)=>scrambled.indexOf(i)),id:'s'+id+'_assemble',tier:'★★连词成句'});const events=s[6].split('|'),ord=events.map((_,i)=>i).reverse();q.push({q:'事件排序：按故事发生顺序点击事件。',tokens:ord.map(i=>events[i]),order:ord.map((_,i)=>ord.indexOf(i)),id:'s'+id+'_sequence',tier:'★★故事排序'});return q}function start(type,id,review=false){run={type,id,qs:type==='unit'?unitQuestions(id):storyQuestions(id),i:0,correct:0,review};mode='quiz';selected=[];answer=null;render()}function quiz(){let q=run.qs[run.i],isUnit=run.type==='unit',s=isUnit?null:DATA.stories[run.id];let options=q.tokens?'<p>已选择的顺序：</p><div class="chips">'+selected.map(i=>'<button data-remove="'+i+'">'+esc(q.tokens[i])+' ✕</button>').join('')+'</div><div class="chips">'+q.tokens.map((x,i)=>'<button data-pick="'+i+'" '+(selected.includes(i)||answer?'disabled':'')+'>'+esc(x)+'</button>').join('')+'</div>'+btn('撤回','undo',selected.length&&!answer?'':'disabled')+' '+btn('重排','clear',selected.length&&!answer?'':'disabled')+' '+btn('检查语序','check',selected.length===q.tokens.length&&!answer?'':'disabled'):'<div>'+q.options.map((x,i)=>'<button class="option '+(answer&&(i===q.answer?'good':i===answer.pick?'bad':''))+'" data-option="'+i+'" '+(answer?'disabled':'')+'>'+'ABC'[i]+'. '+esc(x)+'</button>').join('')+'</div>';let title=isUnit?DATA.units[run.id][1]:s[0];let feedback=answer?'<div class="note '+(answer.ok?'':'err')+'"><b>'+(answer.ok?'✅ 回答正确':'🔎 需要复习')+'</b><p>'+esc(q.why||'注意语序与故事细节。')+'</p><p>正确答案：'+esc(q.tokens?q.order.map(i=>q.tokens[i]).join(q.id.includes('assemble')?' ':' → '):q.options[q.answer])+'</p>'+(s&&q.evidence!=null?'<p>原文证据：'+esc(s[3][q.evidence][1])+'</p>':'')+'</div>'+btn(run.i+1===run.qs.length?'查看成绩':'下一题 →','next'):'';
return '<div class="card"><b>'+esc(title)+' · '+esc(q.tier)+'</b><p>第 '+(run.i+1)+'/'+run.qs.length+' 题 · 当前首答正确 '+run.correct+' 题</p><div class="progress"><i style="width:'+((run.i/run.qs.length)*100)+'%"></i></div>'+btn('退出并返回','quit')+'</div>'+(s?reader(s,answer&&!answer.ok?q.evidence:-1):'')+'<div class="card"><h2>'+esc(q.q)+'</h2>'+options+feedback+'</div>'}function record(ok){let q=run.qs[run.i],old=state.wrong.find(x=>x.qid===q.id);if(!ok&&!old)state.wrong.push({qid:q.id,type:run.type,id:run.id,step:0,due:today()});else if(old){old.step=ok?Math.min(3,old.step+1):0;let d=new Date();d.setDate(d.getDate()+[1,3,7,14][old.step]);old.due=d.toLocaleDateString('sv-SE')}if(ok)run.correct++;answer={ok,pick:q.pick};save()}function score(){let s=run.type==='unit'?60:30,got=Math.round(run.correct/run.qs.length*s);if(!run.review){const key=run.type==='unit'?'unit':'stories';state[key][run.id]=Math.max(state[key][run.id]??0,got);state.history.push({at:today(),type:run.type,id:run.id,score:got});save()}const back=run.type==='unit'?'home':'story';mode=null;run=null;return '<div class="card"><h2>🎉 闯关完成</h2><div style="font-size:44px;color:#237659;font-weight:900">'+got+' / '+s+'</div><p>这次首答正确 '+(Math.round(got/s*100))+'%，建议复习错题并朗读故事。</p>'+btn('返回学习地图','goto','data-target="'+back+'"')+'</div>'}function words(){let raw=DATA.units.flatMap(u=>u[5].split(','));raw.push(...DATA.ext.split(','));let dict=new Map(raw.map(x=>x.split('=')).filter(x=>x.length===2));let arr=[...dict],key=today(),idx=Array.from({length:15},(_,i)=>arr[(new Date(key).getDate()*15+i)%arr.length]);return '<div class="card"><h2>💎 每日15词 · 记忆矿洞</h2><p>点读→遮住释义→回忆词义→自检。题库含小学基础词和初中衔接词，均显示中文解释。</p>'+voicePanel()+'<span class="meta">今日已掌握 '+(state.day[key]?.length||0)+'/15</span><div class="grid">'+idx.map(([w,z],i)=>'<div class="word"><b>'+esc(w)+'</b><small id="meaning'+i+'">点击显示释义</small><p>'+btn('🔊','say','data-text="'+esc(w)+'"')+' '+btn('查看释义','meaning','data-idx="'+i+'" data-text="'+esc(z)+'"')+' '+btn('我记住了','remember','data-word="'+esc(w)+'"')+'</p></div>').join('')+'</div><p>复习方法：先独立回忆，再看中文。认识不等于会用，建议试着口头造句。</p></div>'}function reviews(){let due=state.wrong.filter(x=>x.due<=today());return '<div class="card"><h2>🔁 错题二刷仓库</h2><p>先回忆规则，再做同一道题。正确后按1、3、7、14天逐步延长复习间隔。</p><p>累计错题 '+state.wrong.length+' 道 · 到期 '+due.length+' 道</p>'+btn('开始复习','reviewstart',due.length?'':'disabled')+'</div>'}function growth(){return '<div class="card"><h2>📊 学习记录</h2><p>已完成单元：'+Object.keys(state.unit).length+'/12 · 已完成故事：'+Object.keys(state.stories).length+'/12 · 错题：'+state.wrong.length+'</p><p>学习记录只保存在当前浏览器里，换电脑不会自动同步。请定期导出备份。</p>'+btn('导出学习记录 JSON','export')+' <label class="btn" style="display:inline-block">导入学习记录 <input id="import" type="file" accept=".json" style="display:none"></label><h3>最近记录</h3>'+state.history.slice(-12).reverse().map(x=>'<p>'+esc(x.at)+' · '+(x.type==='unit'?'单元':'阅读')+' '+(x.id+1)+'：'+x.score+'</p>').join('')+'</div>'}function render(){nav();if(run&&mode==='quiz'){$('#app').innerHTML=quiz();return}if(mode==='unit'){$('#app').innerHTML=unitPanel(window.currentUnit);return}if(mode==='story'){$('#app').innerHTML=storyPanel(window.currentStory);return}$('#app').innerHTML=tab==='home'?home():tab==='story'?storyHome():tab==='words'?words():tab==='review'?reviews():growth()}document.addEventListener('click',e=>{let b=e.target.closest('button,[data-tab],[data-open-unit],[data-open-story]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;mode=null;run=null;render();return}if(b.dataset.openUnit!=null){window.currentUnit=+b.dataset.openUnit;mode='unit';render();scrollTo(0,0);return}if(b.dataset.openStory!=null){window.currentStory=+b.dataset.openStory;mode='story';cn=false;render();scrollTo(0,0);return}if(b.dataset.option!=null&&run&&!answer){let q=run.qs[run.i],i=+b.dataset.option;q.pick=i;record(i===q.answer);render();return}if(b.dataset.pick!=null&&run&&!answer){let i=+b.dataset.pick;if(!selected.includes(i))selected.push(i);render();return}if(b.dataset.remove!=null&&run&&!answer){selected=selected.filter(x=>x!==+b.dataset.remove);render();return}if(b.dataset.read!=null){let s=DATA.stories[window.currentStory??run?.id??0];speak(s[3][+b.dataset.read][1]);return}if(b.dataset.say!=null){speak(b.dataset.say);return}let a=b.dataset.a;if(a==='startunit')start('unit',+b.dataset.id);else if(a==='startstory')start('story',+b.dataset.id);else if(a==='story'||a==='home'||a==='back'){mode=null;run=null;tab=a==='story'?'story':'home';render()}else if(a==='quit'){tab=run.type==='unit'?'home':'story';mode=null;run=null;render()}else if(a==='readall'){let id=run?.type==='story'?run.id:window.currentStory;speak(DATA.stories[id][3].map(x=>x[1]).join(' '))}else if(a==='npc')speak(DATA.stories[window.currentStory][3][0][1]);else if(a==='togglecn'){cn=!cn;render()}else if(a==='undo'){selected.pop();render()}else if(a==='clear'){selected=[];render()}else if(a==='check'){let q=run.qs[run.i];record(selected.join(',')===q.order.join(','));render()}else if(a==='next'){if(run.i+1===run.qs.length){let result=score();tab='home';$('#app').innerHTML=result}else{run.i++;answer=null;selected=[];render()}scrollTo(0,0)}else if(a==='goto'){tab=b.dataset.target;render()}else if(a==='words'||a==='review'){tab=a;mode=null;render()}else if(a==='meaning'){$('#meaning'+b.dataset.idx).textContent=b.dataset.text}else if(a==='say')speak(b.dataset.text);else if(a==='remember'){let day=today();state.day[day]??=[];if(!state.day[day].includes(b.dataset.word))state.day[day].push(b.dataset.word);save();render()}else if(a==='saveDraft'){state.draft[window.currentStory]=$('#draft').value;save();b.textContent='✅ 已保存'}else if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let link=document.createElement('a');link.href=url;link.download='english-island-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='reviewstart'){let first=state.wrong.find(x=>x.due<=today());if(first)start(first.type,first.id,true)}});document.addEventListener('change',async e=>{if(e.target.id==='import'){try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.unit||!obj.stories||!Array.isArray(obj.wrong))throw Error('格式不正确');state=Object.assign(defaultState(),obj);save();alert('学习记录已导入');render()}catch(e){alert('导入失败：'+e.message)}}});render()})();
</script></body></html>
