rce":"主题阅读"},{"id":"rd-1-2","type":"mcq","q":"How is Lily at the end?","choices":["Happy","Angry","Tired"],"a":"Happy","why":"Dad 找到铅笔后 Lily 开心了。","passage":"It is morning. Ben is happy. His sister Lily is sad because she cannot find her pencil. Dad helps Lily. Now Lily is happy.","source":"主题阅读"}],"example":["I am happy.","She is tired.","My sister and I are friends."],"lessonTitle":"主格代词与 be 动词","learningGoal":"主格代词与 be 动词"},{"id":"3A-M1U2","name":"M1U2 What's your name?","memory":["I→my；we→our；you→your；he→his；she→her","物主代词后面接名词：my book / his name","a 常见两种发音：[eɪ] 与 [æ]"],"trap":["She 与 her 不要混：She is... / her name","your 是“你的/你们的”，不是 you are"],"words":[["name","名字","name"],["my","我的","my"],["our","我们的","our"],["your","你的；你们的","your"],["his","他的","his"],["her","她的","her"],["their","他们的","their"],["blackboard","黑板","black-board"],["paper","纸","pa-per"],["pencil","铅笔","pen-cil"],["window","窗户","win-dow"],["door","门","door"],["jam","果酱","jam"],["table","桌子","ta-ble"]],"theme":"家庭与人物","reference":"Unit 2 家庭成员","pet":"🦊","focus":"family/father/mother/sister + my/his/her","reading":"This is my family photo. My father is tall. My mother has long hair. My sister is six. Her name is Amy.","extras":[{"type":"mcq","q":"My father’s mother is my ___.","choices":["grandmother","brother","sister"],"a":"grandmother","why":"父亲的母亲是祖母。","id":"ex-2-1","source":"主题试卷变式"},{"type":"mcq","q":"I can see my father. ___ is tall.","choices":["He","She","They"],"a":"He","why":"father 用 he。","id":"ex-2-2","source":"主题试卷变式"},{"type":"fill","q":"This is ___ family photo. (I)","a":"my","answers":["my"],"why":"名词前用 my。","id":"ex-2-3","source":"主题试卷变式"},{"type":"build","q":"排列句子：","tokens":["This","is","my","family."],"a":"This is my family.","why":"This is 引出家庭介绍。","id":"ex-2-4","source":"主题试卷变式"},{"type":"mcq","q":"My brother and I are ___.","choices":["children","child","boy"],"a":"children","why":"两人属于 children。","id":"ex-2-5","source":"主题试卷变式"},{"type":"mcq","q":"They are my parents. ___ are happy.","choices":["They","He","It"],"a":"They","why":"复数主语用 They。","id":"ex-2-6","source":"主题试卷变式"},{"id":"rd-2-1","type":"mcq","q":"Who has long hair?","choices":["My mother","My father","My sister"],"a":"My mother","why":"短文指出母亲有长头发。","passage":"This is my family photo. My father is tall. My mother has long hair. My sister is six. Her name is Amy.","source":"主题阅读"},{"id":"rd-2-2","type":"mcq","q":"How old is Amy?","choices":["Six","Nine","Ten"],"a":"Six","why":"My sister is six。","passage":"This is my family photo. My father is tall. My mother has long hair. My sister is six. Her name is Amy.","source":"主题阅读"}],"example":["I am Kitty. My name is Kitty.","She is Alice. Her bag is new."],"lessonTitle":"物主代词与字母 a 发音","learningGoal":"物主代词与字母 a 发音"},{"id":"3A-M1U3","name":"M1U3 How old are you?","memory":["否定句：be/can 后加 not","一般疑问句：把 be/can 提到句首","I→you；my→your"],"trap":["否定句中的 and 常变 or","some 在否定/疑问中常变 any"],"words":[["read","读","read"],["write","写","write"],["draw","画","draw"],["run","跑","run"],["swim","游泳","swim"],["tall","高的","tall"],["student","学生","stu-dent"],["lovely","可爱的","love-ly"],["soft","柔软的","soft"],["old","……岁的；老的","old"],["year","年；岁","year"],["count","数数","count"]],"theme":"运动与能力","reference":"Unit 4 运动能力","pet":"🐼","focus":"skip/run/jump + can/can’t","reading":"Lily can skip and run. Tom can jump but he cannot ride a bike. They play in the park after school.","extras":[{"type":"mcq","q":"After school, I can ___ a kite.","choices":["fly","flying","flies"],"a":"fly","why":"can 后接动词原形。","id":"ex-3-1","source":"主题试卷变式"},{"type":"mcq","q":"She ___ ride a bike, but she can run.","choices":["can’t","isn’t","not"],"a":"can’t","why":"表示不能做某事用 can’t。","id":"ex-3-2","source":"主题试卷变式"},{"type":"fill","q":"He can ___ high. (jump)","a":"jump","answers":["jump"],"why":"can 后用动词原形。","id":"ex-3-3","source":"主题试卷变式"},{"type":"build","q":"排列句子：","tokens":["Can","you","skip?"],"a":"Can you skip?","why":"一般疑问句 Can 开头。","id":"ex-3-4","source":"主题试卷变式"},{"type":"mcq","q":"“我会跳绳”的英语是：","choices":["I can skip.","I am skip.","I skips."],"a":"I can skip.","why":"can + 动词原形。","id":"ex-3-5","source":"主题试卷变式"},{"type":"mcq","q":"I can jump, but I ___ swim.","choices":["can’t","are","is"],"a":"can’t","why":"but 表示能力对比。","id":"ex-3-6","source":"主题试卷变式"},{"id":"rd-3-1","type":"mcq","q":"What can Lily do?","choices":["Skip and run","Swim and sing","Read and write"],"a":"Skip and run","why":"Lily can skip and run。","passage":"Lily can skip and run. Tom can jump but he cannot ride a bike. They play in the park after school.","source":"主题阅读"},{"id":"rd-3-2","type":"mcq","q":"Can Tom ride a bike?","choices":["No, he can’t.","Yes, he can.","Yes, he is."],"a":"No, he can’t.","why":"Tom cannot ride a bike。","passage":"Lily can skip and run. Tom can jump but he cannot ride a bike. They play in the park after school.","source":"主题阅读"}],"example":["I can run. → Can you run?","He is tall. → Is he tall?"],"lessonTitle":"肯定、否定与一般疑问句","learningGoal":"肯定、否定与一般疑问句"},{"id":"3A-M2U1","name":"M2U1 My friends","memory":["一般疑问句简答：Yes/No + 代词 + be/can","辅音+y→ies；元音+y→s","e 常见发音：[i:] / [e]"],"trap":["Can Danny...? 回答用 he，不用 Danny","baby→babies；boy→boys"],"words":[["Chinese","中国人；中文","Chi-nese"],["Japanese","日本人；日语","Jap-a-nese"],["baby","婴儿","ba-by"],["family","家庭","fam-i-ly"],["story","故事","sto-ry"],["monkey","猴子","mon-key"],["butterfly","蝴蝶","but-ter-fly"],["fly","飞；苍蝇","fly"],["toy","玩具","toy"],["mouse","老鼠","mouse"],["birthday","生日","birth-day"],["dance","跳舞","dance"]],"theme":"朋友与运动","reference":"Unit 4 运动能力","pet":"🐵","focus":"can/are/Yes-No + 简短回答","reading":"Ben is a boy. He can ride a bike. Kitty and Amy are girls. They can fly a kite in the park. The children are happy.","extras":[{"type":"mcq","q":"—Can Danny run? —Yes, ___.","choices":["he can.","he is.","Danny is."],"a":"he can.","why":"Can 开头仍用 can 回答。","id":"ex-4-1","source":"主题试卷变式"},{"type":"mcq","q":"—Are Kitty and Alice happy? —Yes, ___.","choices":["they are.","she is.","they can."],"a":"they are. function absorbLegacy(p){let n=0;for(let u of UNITS){let s=Number(p.boss?.[u.id]||0);if(s>0){state.levels[u.id]=state.levels[u.id]||{};let cap=Math.floor(Math.min(60,s)/3);for(let i=0;i<3;i++)state.levels[u.id][i]=Math.max(scorePart(u.id,i),Math.min(20,cap));n++}}state.stars=Math.max(state.stars||0,p.stars||0);Object.entries(p.wordState||{}).forEach(([key,w])=>{if(w&&typeof w==='object'){state.wordStats[key]={seen:w.seen||0,correct:w.correct||0}}});state.legacyImported=true;return n}

 if(!complete){b+=`<div class="st-task" id="st-task" aria-live="polite"><div class="st-task-title"><span>② 互动问答 · ${t.step+1}/3</span><span class="st-tag">${t.earned} ⭐</span></div><h3>${esc(question.q)}</h3><p>💡 ${esc(question.hint)}</p>`;
 if(question.type==='order'){let tokens=question.tokens.map((v,i)=>({v,i})),reverse=t.step%2===0; tokens=reverse?tokens.reverse():tokens;let chosen=new Set(t.selected.map(x=>x.i));b+=`<div class="st-order-answer" aria-label="当前组成的句子">${t.selected.length?t.selected.map((x,i)=>`<button data-act="stremove" data-idx="${i}">${esc(x.v)} ↶</button>`).join(''):'<span>点击词块，按顺序拼出句子</span>'}</div><div class="st-order-pool">${tokens.map(x=>`<button data-act="sttoken" data-id="${x.i}" ${chosen.has(x.i)||t.status?.ok?'disabled':''}>${esc(x.v)}</button>`).join('')}</div><div class="st-buttons"><button class="btn soft" data-act="stundo" ${!t.selected.length?'disabled':''}>↶ 撤回</button><button class="btn soft" data-act="streset">🔄 重排</button><button class="btn primary" data-act="stcheck" ${t.status?.ok?'disabled':''}>✅ 检查句子</button></div>`}else b+=`<div class="st-option-list">${question.choices.map((x,i)=>`<button class="st-option" data-act="stanswer" data-idx="${i}" ${t.status?.ok?'disabled':''}><span>${'ABC'[i]}</span>${esc(x)}</button>`).join('')}</div>`;

const XP_STORE='englishIslandV54Themes';

const xpSafe=(x)=>esc(String(x??''));
let xpView=null,xpRun=null,xpShowCn=false,xpLastReview=false,xpState={best:{},history:{},review:[]};
try{const s=JSON.parse(localStorage.getItem(XP_STORE)||'null');if(s&&typeof s==='object')xpState=Object.assign(xpState,s)}catch(e){}
function xpSave(){try{localStorage.setItem(XP_STORE,JSON.stringify(xpState))}catch(e){}}
function xpDate(n=0){let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}
function xpDue(){return (xpState.review||[]).filter(x=>x.due<=xpDate())}
function xpTrack(q,themeId,tier,ok){if(!xpState.review)xpState.review=[];let record=xpState.review.find(x=>x.id===q.id);if(!record&&!ok){record={id:q.id,themeId,tier,step:0,due:xpDate(1)};xpState.review.push(record)}else if(record){record.step=ok?Math.min(4,(record.step||0)+1):0;record.due=xpDate(ok?[1,3,7,14][Math.min(3,record.step-1)]:1)}xpSave()}
function xpReviewStart(){let ds=xpDue();if(!ds.length){alert('目前没有到期的主题错题。');return}let lead=ds[0].themeId,items=ds.filter(x=>x.themeId===lead).slice(0,12);let theme=xpTheme(lead),pool=items.map(x=>xpTasks(theme,x.tier).find(q=>q.id===x.id)).filter(Boolean);if(!pool.length)return;xpView=lead;xpRun={id:lead,tier:0,step:0,pool,correct:0,answered:false,reviewMode:true,chosen:null,lastOK:false};render()}

function xpTheme(k){return XP_DATA.find(x=>x.id===k)}
function xpTasks(theme,tier){let drills=theme.drills.filter(x=>x.tier===tier).map(x=>({...x,story:null}));let story=theme.stories[tier];let rd=story.qs.map(q=>({...q,story,storyTier:tier}));return [...drills,...rd]}
function xpBest(theme,tier){return xpState.best?.[theme.id]?.[tier]||0}
function xpShow(){if(xpRun){xpDrawQuiz();return}if(!xpView){render();return}let d=xpTheme(xpView);if(!d){xpView=null;render();return}document.getElementById('app').innerHTML=xpLesson(d);window.scrollTo({top:0,behavior:'instant'})}
function xpHub(){let total=XP_DATA.reduce((n,t)=>n+t.drills.length+t.stories.reduce((a,s)=>a+s.qs.length,0),0);return `<section class="xp-section" id="xp-hub"><div class="xp-head"><div><span class="xp-chip">📕 新增教材关联拓展</span><h2>🐾 8大主题阅读训练馆</h2><p>参考上传的 Unit 1–8 标准试卷训练方向：词语理解、句型辨析、对话阅读、查找原文证据。各主题从基础到挑战依次升级，不改变原来12关。</p></div><span class="xp-tag">新增 ${total} 道互动题</span></div><div class="xp-theme-grid">${XP_DATA.map((t,i)=>`<button class="xp-theme" data-xp="open" data-id="${t.id}"><span class="xp-animal">${t.emoji}</span><strong>${i+1}. ${xpSafe(t.title)}</strong><small>${xpSafe(t.tag)} · 3段阅读</small><small>当前最高 ${[0,1,2].reduce((s,k)=>s+xpBest(t,k),0)}/60分 →</small></button>`).join('')}</div><p class="xp-hint" style="margin-top:11px">来源说明：用户提供的两本练习册目前只有封面；本栏目以已上传的8套单元卷和自编变式为基础，未复刻练习册的未提供内页。</p></section>`}
function xpLesson(t){const n=XP_DATA.indexOf(t);return `<div class="xp-wrap"><div class="xp-head"><button class="xp-btn" data-xp="back">← 返回方块世界</button><span class="xp-chip">主题 ${n+1}/8 · ${xpSafe(t.unit)}</span></div><section class="xp-section"><div class="xp-intro"><div><span class="xp-chip">${xpSafe(t.tag)}</span><h2>${t.emoji} ${xpSafe(t.title)}</h2><p>每个难度完成“词汇与句型练习 + 动物情境阅读”并获得0–20分；三级合计60分。</p></div><span style="font-size:64px" aria-hidden="true">${t.emoji}</span></div><div class="xp-head"><span class="xp-level-point">最高成绩 ${[0,1,2].reduce((s,k)=>s+xpBest(t,k),0)} / 60</span><span class="xp-chip">8词 · 3篇原创阅读 · 20题</span></div></section><section class="xp-lesson"><h3>🧠 必会知识点</h3><p>${t.knows.map((v,i)=>`${i+1}. ${xpSafe(v)}`).join('　｜　')}</p><p style="color:#a46620;margin-top:8px">⚠️ ${t.trap.map(xpSafe).join('；')}</p></section><section class="xp-lesson"><h3>🔊 8个主题词 · 词义＋词性＋例句</h3><p class="xp-small">点击单词和例句听读；词义对应具体语境，不代表该词的全部意思。</p><div class="xp-words">${t.words.map(w=>`<div class="xp-word"><b>${xpSafe(w.w)}</b><span>${xpSafe(w.pos)} · ${xpSafe(w.cn)}</span><small>${xpSafe(w.example)}</small><div class="xp-inline"><button class="xp-btn" data-xp="speak" data-text="${attr(w.w)}">🔊 单词</button><button class="xp-btn" data-xp="speak" data-text="${attr(w.example)}">▶ 例句</button></div></div>`).join('')}</div></section><section class="xp-stage-grid">${t.stories.map((s,i)=>`<div class="xp-stage"><span class="xp-chip">${XP_STAGES[i]}</span><h3>📖 ${xpSafe(s.title)}</h3><p>${s.lines.length}句动物对话 · ${xpTasks(t,i).length}道互动题</p><div class="xp-head"><strong>最好 ${xpBest(t,i)}/20</strong><button class="xp-btn ${i===2?'gold':'primary'}" data-xp="start" data-id="${t.id}" data-tier="${i}">${xpBest(t,i)?'再次挑战':'开始闯关'} →</button></div></div>`).join('')}</section><p class="xp-small">${xpSafe(t.notes)}</p></div>`}
function xpRead(st, evidence=-1){return `<div class="xp-passage"><div class="xp-head"><b>📖 ${xpSafe(st.title)}</b><div class="xp-inline"><button class="xp-btn" data-xp="readall">🔊 全文朗读</button><button class="xp-btn" data-xp="translation">${xpShowCn?'隐藏中文':'中文提示'}</button></div></div>${st.lines.map((line,i)=>`<div class="xp-line ${i===evidence?'xp-evidence':''}"><span class="xp-avatar" aria-hidden="true">${i%2?'🧒':'🐾'}</span><div><b>${xpSafe(line[0])}:</b> <span class="xp-spoken">${xpSafe(line[1])}</span>${xpShowCn?`<div class="xp-chn">${xpSafe(line[2])}</div>`:''}</div><button data-xp="readline" data-line="${i}" aria-label="朗读第${i+1}句">🔊</button></div>`).join('')}</div>`}
function xpDrawQuiz(){let r=xpRun,t=xpTheme(r.id),q=r.pool[r.step],n=r.pool.length;if(!q){xpFinish();return}let html=`<div class="xp-wrap"><div class="xp-head"><button class="xp-btn" data-xp="pause">← 暂停返回</button><span class="xp-chip">${t.emoji} ${xpSafe(t.title)} · ${XP_STAGES[r.tier]}</span><span class="xp-grade">首次答对 ${r.correct}/${r.step+(r.answered?1:0)}</span></div><section class="xp-panel"><div class="xp-head"><b>第 ${r.step+1}/${n} 题</b><b>本级满分 20分</b></div><div class="xp-progress"><i style="width:${(r.step/n*100).toFixed(2)}%"></i></div></section>${q.story?xpRead(q.story,r.answered&&!r.lastOK?q.evidence:-1):`<section class="xp-panel"><div class="xp-head"><b>🧩 词义 / 句型练习</b><button class="xp-btn" data-xp="speak" data-text="${attr(q.q)}">🔊 听题</button></div><p class="xp-muted">先理解句子，再选择。</p></section>`}<section class="xp-panel"><span class="xp-chip">${q.story?'阅读侦探 · 找证据':'学习任务'}</span><h2 class="xp-title" style="margin:12px 0">${xpSafe(q.q)}</h2><div class="xp-options">${q.options.map((op,j)=>`<button class="xp-choice ${r.answered&&j===q.answer?'good':''} ${r.answered&&j===r.chosen&&!r.lastOK?'bad':''}" data-xp="answer" data-index="${j}" ${r.answered?'disabled':''}>${String.fromCharCode(65+j)}. ${xpSafe(op)}</button>`).join('')}</div>${r.answered?`<div class="xp-feedback ${r.lastOK?'good':'bad'}" style="margin-top:14px">${r.lastOK?'✅ 答对了！':'🔎 再查证据：'} ${xpSafe(q.why)}${q.story?`<p class="xp-ev">原文线索：${xpSafe(q.story.lines[q.evidence][1])}</p><button class="xp-btn" data-xp="evidence">🔊 听证据句</button>`:''}<p style="margin-top:8px">正确答案：<b>${xpSafe(q.options[q.answer])}</b></p></div><div class="xp-inline" style="margin-top:12px"><button class="xp-btn primary" data-xp="next">${r.step+1===n?'查看成绩':'下一题 →'}</button></div>`:'<p class="xp-hint" style="margin-top:10px">请独立选择。答错后会显示原因和原文线索。</p>'}</section></div>`;document.getElementById('app').innerHTML=html}
function xpFinish(){let r=xpRun,t=xpTheme(r.id);let pts=Math.round(r.correct/r.pool.length*20);if(!r.reviewMode){xpState.best[t.id]||={};xpState.best[t.id][r.tier]=Math.max(pts,xpBest(t,r.tier));}xpState.history[`${t.id}-${r.tier}`]={date:new Date().toLocaleDateString('sv-SE'),correct:r.correct,total:r.pool.length};xpSave();document.getElementById('app').innerHTML=`<section class="xp-section"><div class="xp-head"><span class="xp-chip">${XP_STAGES[r.tier]} · 已完成</span><button class="xp-btn" data-xp="pause">← 返回主题训练</button></div><h2>🎉 ${t.emoji} ${r.reviewMode?'错题二刷结束':'本级闯关结束'}</h2><p class="xp-result">${pts} / 20分</p><p>首次答对 ${r.correct}/${r.pool.length} 题。${r.reviewMode?'本轮二刷结束，按计划继续巩固。':pts>=16?'掌握较好，可以尝试下一难度。':'建议先重新听原文，再练一次。'}</p><p>三段最好成绩：<b>${[0,1,2].reduce((s,k)=>s+xpBest(t,k),0)}/60分</b></p><div class="xp-inline" style="margin-top:13px"><button class="xp-btn primary" data-xp="pause">${r.reviewMode?'返回复习仓库':'返回词汇与三档关卡'}</button>${r.reviewMode?'':`<button class="xp-btn gold" data-xp="start" data-id="${t.id}" data-tier="${Math.min(2,r.tier+1)}">${r.tier<2?'挑战下一难度':'重练挑战'} →</button>`}</div></section>`;r.finished=true;xpLastReview=!!r.reviewMode;xpRun=null}

const XP_PRE_REVIEW=reviewPage;

document.addEventListener('click',event=>{let b=event.target.closest('[data-xp]');if(!b)return;let a=b.dataset.xp;if(a==='reviewstart'){xpReviewStart()}else if(a==='open'){xpView=b.dataset.id;xpRun=null;xpShow()}else if(a==='back'){xpView=null;xpRun=null;xpShow()}else if(a==='pause'){let r=xpRun;xpRun=null;if(r?.reviewMode||xpLastReview){xpLastReview=false;xpView=null;view='review';render()}else xpShow()}else if(a==='start'){xpView=b.dataset.id;let t=xpTheme(xpView),tier=Number(b.dataset.tier);xpLastReview=false;xpRun={id:t.id,tier,step:0,pool:xpTasks(t,tier),correct:0,answered:false,chosen:null,lastOK:false};xpShowCn=false;render()}else if(a==='answer'){let r=xpRun;if(!r||r.answered)return;let q=r.pool[r.step];r.chosen=Number(b.dataset.index);r.lastOK=r.chosen===q.answer;r.correct+=Number(r.lastOK);xpTrack(q,r.id,r.reviewMode?(xpState.review.find(x=>x.id===q.id)?.tier||0):r.tier,r.lastOK);r.answered=true;xpDrawQuiz()}else if(a==='next'){let r=xpRun;if(!r||!r.answered)return;r.step++;r.answered=false;r.chosen=null;render()}else if(a==='translation'){xpShowCn=!xpShowCn;xpDrawQuiz()}else if(a==='readall'){let r=xpRun,q=r?.pool[r.step];if(q?.story)vxRead(q.story.lines.map(l=>l[1]).join(' '))}else if(a==='readline'){let r=xpRun,q=r?.pool[r.step];if(q?.story)vxRead(q.story.lines[Number(b.dataset.line)]?.[1]||'')}else if(a==='evidence'){let r=xpRun,q=r?.pool[r.step];if(q?.story)vxRead(q.story.lines[q.evidence][1])}else if(a==='speak')vxRead(b.dataset.text||'');});

.quest-hub h2{margin:6px 0;color:#1a5c47;font-size:clamp(22px,2.3vw,30px)}
.quest-hub p,.quest-help{color:#42665b;font-size:14px;line-height:1.7}
.quest-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.quest-tile{border:2px solid #9bc6a1;background:linear-gradient(155deg,#fff,#effaf1);border-radius:16px;text-align:left;cursor:pointer;padding:13px;min-height:145px;position:relative;box-shadow:0 4px 0 #b7d5be;transition:transform .18s ease,box-shadow .18s ease;font:inherit;color:#215046}
.quest-tile:hover,.quest-tile:focus-visible{transform:translateY(-3px);box-shadow:0 7px 0 #b7d5be;outline-color:#41865b}
.quest-tile .quest-emoji{display:block;font-size:39px;filter:drop-shadow(2px 3px #acc9aa);margin-bottom:5px}
.quest-tile strong{display:block;font-size:17px}.quest-tile small{display:block;color:#547269;margin:4px 0;font-size:12px}
.quest-badge{font-size:12px;border-radius:100px;background:#fff1bc;color:#855e16;font-weight:800;display:inline-block;padding:4px 10px}
.quest-page{margin:10px auto 22px;max-width:1050px}
.quest-action{font:inherit;cursor:pointer;background:#fff;border:2px solid #9ac7b2;color:#195d4b;border-radius:12px;padding:10px 13px;min-height:40px;font-weight:700}
.quest-action.primary{background:#196d56;color:#fff;border-color:#196d56}.quest-action.gold{background:#fff0a3;border-color:#d8ad35;color:#644916}

.quest-box{background:#fff;border:2px solid #c7e5ca;padding:16px;border-radius:19px;box-shadow:0 4px 0 #deebd7;margin:12px 0}
.quest-box h2,.quest-box h3{margin:4px 0 10px}
.quest-land{min-height:215px;overflow:hidden;border-radius:18px;border:3px solid #428f71;background:linear-gradient(#a5e6fc 0 63%,#6aa75e 63% 70%,#996840 70% 100%);position:relative;isolation:isolate}
.quest-land::before{content:'☁️      ☁️';white-space:pre;font-size:36px;position:absolute;top:12px;left:-10%;opacity:.9;animation:qCloud 20s linear infinite}
.quest-land::after{content:' ';position:absolute;bottom:40px;left:-8px;right:-8px;height:25px;background:repeating-linear-gradient(90deg,#7aca63 0 35px,#65ae51 35px 60px);clip-path:polygon(0 25%,8% 25%,8% 0,17% 0,17% 40%,28% 40%,28% 10%,40% 10%,40% 40%,52% 40%,52% 0,70% 0,70% 30%,82% 30%,82% 0,100% 0,100% 100%,0 100%)}

.quest-sentence .quest-token:hover,.quest-sentence .quest-token:focus-visible{background:#d9f2d9}

.quest-levelbar div.active{background:#cef1d7;color:#13694c;outline:2px solid #71bc91}
.quest-question{font-size:clamp(18px,2vw,24px);line-height:1.5;color:#184b3e;font-weight:800}
.quest-options{display:grid;gap:9px;margin:12px 0}
.quest-option{border:2px solid #bfd9c6;border-radius:12px;text-align:left;cursor:pointer;padding:14px;font:inherit;font-weight:750;background:#f9fffa;color:#224f3f}
.quest-option:hover{background:#e7f6e6}.quest-option.selected{background:#d9eaff;border-color:#4389cd}
.quest-option.good{background:#d5f4d8;border-color:#28a464}.quest-option.bad{background:#ffe7e3;border-color:#d16f56}
.quest-feedback{padding:13px 15px;border-radius:13px;margin:12px 0;background:#e8f9e7;border-left:5px solid #48ab6c;line-height:1.8}
.quest-feedback.bad{background:#fff2e8;border-left-color:#d68b41}
.quest-answer-slot{border:2px dashed #75a892;border-radius:12px;padding:12px;min-height:62px;display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center;background:#f8fff6}
.quest-chip{border:2px solid #90c5a5;border-radius:10px;padding:10px 12px;font:inherit;color:#205740;background:#eff8ee;cursor:pointer;font-weight:750;min-height:41px}
.quest-chip.used{opacity:.25;cursor:default}.quest-chip.in-slot{background:#e4ffce;border-color:#75ba65}
.quest-progress{height:12px;border-radius:100px;background:#e2e9dd;overflow:hidden}.quest-progress i{display:block;height:100%;background:linear-gradient(90deg,#75d48e,#24aa79)}
.quest-evidence{border:3px solid #ffc95b !important;background:#fff8db !important}
.quest-write{width:100%;min-height:90px;border-radius:11px;border:2px solid #c8d8c7;padding:12px;font:inherit;font-size:16px;resize:vertical}
.quest-score{font-size:46px;font-weight:900;color:#15694e}
@keyframes qBob{50%{transform:translateY(-12px) rotate(3deg)}}@keyframes qCloud{to{transform:translateX(110vw)}}
@media(max-width:650px){.quest-hub{padding:10px}.quest-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.quest-tile{padding:9px;min-height:136px}.quest-page .quest-box{padding:11px}.quest-sprite{font-size:60px;left:2%}.quest-landmark{font-size:60px}.quest-cloudtext{left:22%;right:5%;padding:10px;top:17px;font-size:13px}.quest-page:has(.quest-quiz) .quest-reader{max-height:340px;overflow:auto;scrollbar-color:#82bc8f #ecf8ed}.quest-storyline{padding:9px;gap:7px}.quest-storyline b{min-width:48px;font-size:12px}.quest-levelbar div{font-size:12px}.quest-options{gap:8px}}

const QUEST_KEY='englishIslandV55StoryQuest';
let questView=null,questRun=null,questShowChinese=false,questWork=[],questPick=[],questAnswer=false,questReview=false;
let questData={best:{},last:{},review:[],drafts:{},history:[]};
try{const v=JSON.parse(localStorage.getItem(QUEST_KEY)||'null');if(v&&typeof v==='object')questData=Object.assign(questData,v)}catch(e){}
function questSave(){try{localStorage.setItem(QUEST_KEY,JSON.stringify(questData))}catch(e){}}
function questHtml(s){return esc(String(s??''))}
function questAttr(s){return questHtml(s).replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function questFind(id){return QUEST_DATA.find(m=>m.id===id)}
function questDate(days=0){let date=new Date();date.setDate(date.getDate()+days);return date.toLocaleDateString('sv-SE')}
function questDue(){return (questData.review||[]).filter(v=>v.due<=questDate())}
function questRec(qid){return questData.review.find(x=>x.id===qid)}
function questTrack(task,missionId,ok){let r=questRec(task.id);if(!ok&&!r){r={id:task.id,missionId,stage:0,due:questDate(1)};questData.review.push(r)}else if(r){r.stage=ok?Math.min(4,(r.stage||0)+1):0;r.due=questDate(ok?[1,3,7,14][Math.min(3,r.stage-1)]:1)}questSave()}
function questTier(idx){return idx<4?'🌱 基础理解':idx<8?'🌿 进阶迁移':'🐉 阅读挑战'}
function questBest(m){return questData.best[m.id]||0}
function questHero(m){return `<div class="quest-land"><button class="quest-sprite" data-quest="npcspeak" aria-label="点击动物朗读故事开头">${m.emoji}</button><span class="quest-landmark" aria-hidden="true">${m.scene.includes('春节')?'🏮':m.scene.includes('市集')?'🛒':m.scene.includes('雪')?'🌲':m.scene.includes('学校')?'🏫':m.scene.includes('生日')?'🎂':m.scene.includes('农田')?'🥕':'🏡'}</span><div class="quest-cloudtext">${questHtml(m.scene)}<br/><small>🔊 点击动物，会听到它的英语介绍</small></div></div>`}
function questHub(){return `<section class="quest-hub" id="quest-hub"><div class="quest-row"><div><span class="quest-badge">📚 课外阅读提优 · 真实学习任务</span><h2>🧱 方块故事任务工坊</h2><p>新提供的练习册内页启发：看图推断、事件排序、姓名与家庭、春节、生日、购物及社交对话。新增12段原创故事、120道分级互动题；每关独立计分30分。</p></div><div style="font-size:43px" aria-hidden="true">📖🐻🧱</div></div><div class="quest-tiles">${QUEST_DATA.map((m,i)=>`<button class="quest-tile" data-quest="open" data-id="${m.id}"><span class="quest-emoji">${m.emoji}</span><strong>${i+1}. ${questHtml(m.title)}</strong><small>${questHtml(m.topic)}</small><span class="quest-badge">最高 ${questBest(m)}/30 · ${m.tasks.length}题</span></button>`).join('')}</div><div class="quest-row"><span class="quest-help">每关按基础 → 进阶 → 挑战推进；听读与查证据不扣分。</span><button class="quest-action gold" data-quest="reviewStart" ${questDue().length?'':'disabled'}>📦 故事错题复习 ${questDue().length}</button></div><p class="quest-help">教材依据：你上传的江苏版练习册内页与既有3A同步资料。新故事与练习为原创改编，非扫描页复制。原12关与每日15词保留。</p></section>`}
function questWords(line){return line.split(/\s+/).map((w)=>`<button class="quest-token" data-quest="say" data-text="${questAttr(w)}" title="点击听单词">${questHtml(w)} </button>`).join('')}
function questRead(m,hilite=-1){return `<section class="quest-box quest-reader"><div class="quest-row"><h3>📖 ${questHtml(m.title)} · 阅读对话</h3><div class="quest-row"><button class="quest-action" data-quest="sayAll">🔊 全文</button><button class="quest-action" data-quest="cn">${questShowChinese?'隐藏中文':'显示中文'}</button></div></div><p class="quest-help">每句可点读，点击单词可单独听读。答错后黄色标出的句子就是原文证据。</p>${m.lines.map((ln,i)=>`<div class="quest-storyline ${hilite===i?'quest-evidence':''}"><b>${questHtml(ln[0])}</b><div class="quest-sentence">${questWords(ln[1])}${questShowChinese?`<div class="quest-chinese">${questHtml(ln[2])}</div>`:''}</div><button class="quest-action" data-quest="readline" data-line="${i}">🔊</button></div>`).join('')}</section>`}
function questInfo(m){return `<div class="quest-page"><div class="quest-row"><button class="quest-action" data-quest="home">← 返回故事地图</button><span class="quest-badge">${questHtml(m.topic)} · ${m.tasks.length}道题</span></div>${questHero(m)}<section class="quest-box"><h2>🎯 本关必会</h2><p>${m.notes.map((x,i)=>`${i+1}. ${questHtml(x)}`).join('　｜　')}</p><div class="quest-row"><strong>最好成绩 ${questBest(m)} / 30 分</strong><button class="quest-action primary" data-quest="start" data-id="${m.id}">▶ 开始基础 → 进阶 → 挑战</button></div></section><section class="quest-box"><h3>📘 词语小词典 · 6个重点词</h3><div class="quest-words">${m.words.map(w=>`<div class="quest-word"><strong>${questHtml(w.en)}</strong><small>${questHtml(w.pos)} · ${questHtml(w.cn)}</small><button class="quest-action" data-quest="say" data-text="${questAttr(w.en)}">🔊 点读</button></div>`).join('')}</div></section>${questRead(m)}<section class="quest-box"><h3>✍️ 自由表达小任务</h3><p>${questHtml(m.writing)}</p><textarea class="quest-write" id="quest-draft" placeholder="可在这里练习写英语句子；系统只保存草稿，不自动判断开放式写作的对错。">${questHtml(questData.drafts[m.id]||'')}</textarea><div class="quest-row"><button class="quest-action" data-quest="saveDraft">💾 保存我的句子</button><span class="quest-help">写作不自动评分，建议请老师或家长检查。</span></div></section></div>`}
function questStart(id,reviewIds=null){const m=questFind(id);if(!m)return;questView=id;questReview=!!reviewIds;questRun={mission:id,positions:reviewIds?m.tasks.map((q,i)=>reviewIds.includes(q.id)?i:-1).filter(i=>i>=0):m.tasks.map((_,i)=>i),index:0,correct:0,attempts:0,answered:false,chosen:null,ok:false};questAnswer=false;questPick=[];questShowChinese=false;questRender();document.querySelector('.quest-quiz')?.scrollIntoView({block:'start'})}
function questAnswerString(q){return q.type==='assemble'?q.tokens.filter((_,i)=>false).join(''):q.type==='sequence'?q.answer.map(i=>q.tokens[i]).join(' → '):q.options[q.answer]}
function questQuiz(){let r=questRun,m=questFind(r.mission),n=r.positions.length,q=m.tasks[r.positions[r.index]];if(!q){questFinish();return}let picks=questPick.map(i=>`<button class="quest-chip in-slot" data-quest="unpick" data-index="${i}">${questHtml(q.tokens[i])} ✕</button>`).join('');let optionUI=q.type==='assemble'||q.type==='sequence'?`<div class="quest-answer-slot">${picks||'<span style="color:#688b70">按正确顺序点击下方词块 / 事件卡</span>'}</div><div class="quest-row" style="justify-content:flex-start">${q.tokens.map((t,i)=>`<button class="quest-chip ${questPick.includes(i)?'used':''}" data-quest="pick" data-index="${i}" ${questPick.includes(i)||r.answered?'disabled':''}>${questHtml(t)}</button>`).join('')}</div><div class="quest-row"><button class="quest-action" data-quest="undo" ${!questPick.length||r.answered?'disabled':''}>↶ 撤回</button><button class="quest-action" data-quest="clear" ${!questPick.length||r.answered?'disabled':''}>重新排列</button><button class="quest-action primary" data-quest="check" ${questPick.length!==q.tokens.length||r.answered?'disabled':''}>✅ 检查答案</button></div>`:`<div class="quest-options">${q.options.map((o,i)=>`<button class="quest-option ${r.answered&&i===q.answer?'good':''} ${r.answered&&i===r.chosen&&!r.ok?'bad':''}" data-quest="answer" data-index="${i}" ${r.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${questHtml(o)}</button>`).join('')}</div>`;return `<div class="quest-page"><div class="quest-row"><button class="quest-action" data-quest="pause">← 暂停（保留已完成成绩）</button><span class="quest-badge">${m.emoji} ${questHtml(m.title)} · ${questReview?'错题二刷':'首次闯关'}</span><span>首答正确 ${r.correct} 题</span></div><div class="quest-levelbar">${['🌱 基础理解','🌿 进阶迁移','🐉 阅读挑战'].map((x,i)=>`<div class="${m.tasks[r.positions[r.index]].tier===i?'active':''}">${x}</div>`).join('')}</div><section class="quest-box"><div class="quest-row"><strong>第 ${r.index+1} / ${n} 题</strong><small>${questReview?'复习不计分':'每题3分 · 满分30分'}</small></div><div class="quest-progress"><i style="width:${r.index/n*100}%"></i></div></section>${questRead(m,r.answered&&!r.ok&&q.type!=='sequence'?q.evidence:-1)}<section class="quest-box quest-quiz"><span class="quest-badge">${q.type==='tf'?'判断正误':q.type==='blank'?'语境选词':q.type==='assemble'?'连词成句':q.type==='sequence'?'事件排序':'信息理解'}</span><h2 class="quest-question">${questHtml(q.q)}</h2>${optionUI}${r.answered?`<div class="quest-feedback ${r.ok?'':'bad'}">${r.ok?'✅ 首次答对！':'🔎 这一题需要回原文寻找线索。'}<br/>${questHtml(q.why)}<br/><b>正确答案：</b>${questHtml(q.type==='assemble'?q.example:q.type==='sequence'?q.answer.map(i=>q.tokens[i]).join(' → '):q.options[q.answer])}<br/><b>原文证据：</b>${q.type==='sequence'?'请结合整个故事核对事件前后顺序。':questHtml(m.lines[q.evidence][1])}<div style="margin-top:7px"><button class="quest-action" data-quest="sayevidence">🔊 听证据句</button></div></div><button class="quest-action primary" data-quest="next" style="margin-top:12px">${r.index+1===n?'查看学习报告':'继续下一题 →'}</button>`:''}</section></div>`}
function questFinish(){let r=questRun,m=questFind(r.mission),score=Math.round(r.correct/r.positions.length*30);if(!questReview){questData.best[m.id]=Math.max(score,questBest(m));questData.last[m.id]={date:questDate(),correct:r.correct,total:r.positions.length,score};questData.history.push({id:m.id,date:questDate(),score});questData.history=questData.history.slice(-200)}questSave();questRun={...r,done:true};document.querySelector('#app').innerHTML=`<div class="quest-page"><section class="quest-box"><span class="quest-badge">${m.emoji} ${questHtml(m.title)} · 完成</span><h2>🎉 ${questReview?'回访复习完成':'故事任务完成！'}</h2><div class="quest-score">${score}/30</div><p>首次独立答对 ${r.correct}/${r.positions.length} 道。${r.correct/r.positions.length>=.8?'理解表现较好，可继续高难度挑战。':'建议再听一次故事，并复习标记的错题。'}</p><p>本关历史最高：<b>${questBest(m)}/30分</b></p><div class="quest-row"><button class="quest-action primary" data-quest="again">🔁 再挑战一次</button><button class="quest-action" data-quest="detail">📖 返回阅读与词典</button><button class="quest-action" data-quest="home">🏝️ 回到故事地图</button></div><p class="quest-help">☆ 星星与积分仅来自完成英语学习任务，不设计付费道具或速度排名。</p></section></div>`;questRun=null}
function questRender(){if(!questView){questRun=null;render();return}let m=questFind(questView);if(!m){questView=null;render();return}const position=window.scrollY;document.querySelector('#app').innerHTML=questRun?questQuiz():questInfo(m);window.scrollTo({top:position,behavior:'instant'})}
function questEnterHome(){questView=null;questRun=null;questReview=false;render()}
function questReviewStart(){let due=questDue();if(!due.length){alert('故事错题目前没有到期任务。');return}let first=due[0].missionId;questStart(first,due.filter(x=>x.missionId===first).map(x=>x.id))}
function questComplete(pick){const r=questRun;if(!r||r.answered)return;let m=questFind(r.mission),q=m.tasks[r.positions[r.index]];r.chosen=pick;r.ok=(q.type==='assemble'||q.type==='sequence')?pick.join(',')===q.answer.join(','):pick===q.answer;r.correct+=Number(r.ok);r.attempts++;r.answered=true;questTrack(q,m.id,r.ok);questRender()}
const QUEST_PRE_RENDER=render;
render=function(){if(questView){questRender();return}QUEST_PRE_RENDER();if(view==='island'&&!session&&!activeUid&&!stTalk&&!srRun&&!xpView&&!xpRun){const host=document.getElementById('app');if(host&&!host.querySelector('#quest-hub')){const after=document.getElementById('xp-hub');if(after)after.insertAdjacentHTML('beforebegin',questHub());else host.insertAdjacentHTML('beforeend',questHub())}}else if(view==='review'&&!xpView){let host=document.getElementById('app');if(host&&!host.querySelector('#quest-hub'))host.insertAdjacentHTML('beforeend',`<div class="quest-hub"><div class="quest-row"><div><h2>📚 方块故事到期复习</h2><p>故事题到期 ${questDue().length} 道；使用原文证据重新理解错题。</p></div><button class="quest-action primary" data-quest="reviewStart" ${questDue().length?'':'disabled'}>开始故事回访</button></div></div>`)}}
const QUEST_PRE_EXPORT=exportSave;
exportSave=function(){const out={format:'EnglishIslandProgress',version:'5.5',exportedAt:new Date().toISOString(),state,v53words:{...vxData,session:vxRun},themePractice:xpState,questPractice:questData};let url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='英语岛V5.5_完整学习记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const QUEST_PRE_IMPORT=importState;
importState=function(p){QUEST_PRE_IMPORT(p);if(p?.questPractice&&typeof p.questPractice==='object'){questData=Object.assign({best:{},last:{},review:[],drafts:{},history:[]},p.questPractice);questSave()}render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-quest]');if(!b)return;let ac=b.dataset.quest;if(ac==='open'){questView=b.dataset.id;questRun=null;questShowChinese=false;questRender();window.scrollTo({top:0,behavior:'instant'})}else if(ac==='home'){questEnterHome()}else if(ac==='pause'){questRun=null;questRender()}else if(ac==='start'){questStart(b.dataset.id)}else if(ac==='reviewStart'){questReviewStart()}else if(ac==='readline'){if(questView){const m=questFind(questView);vxRead(m.lines[+b.dataset.line]?.[1]||'')}}else if(ac==='sayAll'){if(questView)vxRead(questFind(questView).lines.map(x=>x[1]).join(' '),.78)}else if(ac==='say'){vxRead(b.dataset.text||'')}else if(ac==='npcspeak'){if(questView)vxRead(questFind(questView).lines[0][1])}else if(ac==='cn'){questShowChinese=!questShowChinese;questRender()}else if(ac==='saveDraft'){let el=document.getElementById('quest-draft');if(el&&questView){questData.drafts[questView]=el.value;questSave();b.textContent='✅ 已保存'}}else if(ac==='answer'){questComplete(Number(b.dataset.index))}else if(ac==='pick'){if(!questRun||questRun.answered)return;let ix=Number(b.dataset.index);if(!questPick.includes(ix))questPick.push(ix);questRender()}else if(ac==='unpick'){questPick=questPick.filter(x=>x!==Number(b.dataset.index));questRender()}else if(ac==='undo'){questPick.pop();questRender()}else if(ac==='clear'){questPick=[];questRender()}else if(ac==='check'){if(questRun&&!questRun.answered&&questPick.length===questFind(questRun.mission).tasks[questRun.positions[questRun.index]].tokens.length)questComplete([...questPick])}else if(ac==='sayevidence'){if(questRun){let m=questFind(questRun.mission),q=m.tasks[questRun.positions[questRun.index]];vxRead(m.lines[q.evidence][1])}}else if(ac==='next'){if(!questRun||!questRun.answered)return;questRun.index++;questRun.answered=false;questPick=[];if(questRun.index===questRun.positions.length){questFinish();window.scrollTo({top:0,behavior:'instant'})}else{questRender();document.querySelector('.quest-quiz')?.scrollIntoView({block:'start'})}}else if(ac==='again'){questStart(questView)}else if(ac==='detail'){questRun=null;questRender()}});

document.title='英语岛大冒险 V5.6 · 完整在线修复版';const qLogo=document.querySelector('.brand h1');if(qLogo)qLogo.innerHTML='英语岛大冒险 <span style="color:#398459">V5.6</span>';const qSub=document.querySelector('.brand small');if(qSub)qSub.textContent='V5.6 完整题库 · 方块世界 · 12关 · 每日15词 · 阅读 · 错题复习';render();

<script>
/* V5.6 full edition: preserve all V5.5 module data; consolidate export/import and provide visible local-first controls. */
(()=>{
  'use strict';
  const oldExport=exportSave, oldImport=importState;
  const getLegacy=()=>{try{let x=JSON.parse(localStorage.getItem('english-island-online-v1')||'null');return x&&typeof x==='object'?x:null}catch(e){return null}};
  const saveFile=(data,filename)=>{
    const file=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(file);
    const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),9000);
  };
  exportSave=function(){
    try{
      const backup={format:'EnglishIslandProgress',version:'5.6',exportedAt:new Date().toISOString(),state,
        v53words:{...vxData,session:vxRun},themePractice:xpState,questPractice:questData,
        legacyOnlineProgress:getLegacy()};
      saveFile(backup,'English_Island_V5_6_Progress.json');
    }catch(e){alert('备份失败：'+e.message+'。请检查浏览器下载权限。')}
  };
  importState=function(p){
    if(!p||typeof p!=='object'||Array.isArray(p))throw Error('请选择英语岛生成的 JSON 备份文件');
    if(p.format&&p.format!=='EnglishIslandProgress')throw Error('不是英语岛的学习记录文件');
    if(p.version==='5.6'&&!p.state)throw Error('备份文件缺少主学习记录');
    oldImport(p);
    if(p.legacyOnlineProgress&&typeof p.legacyOnlineProgress==='object')writeStore('english-island-online-v1',p.legacyOnlineProgress);
    render();
  };
  const nav=document.getElementById('nav');
  if(!nav)return;
  nav.insertAdjacentHTML('afterend',`<div class="v56-tools" role="group" aria-label="学习记录与更新工具">
     <div class="v56-caption"><strong>🧱 V5.6 完整修复版</strong><div>记录保存在当前浏览器；换设备请先备份。</div></div>
     <button type="button" class="v56-primary" data-v56="export">💾 备份进度</button>
     <label title="选择旧版学习记录文件">📥 恢复记录<input id="v56-file" type="file" accept=".json,application/json"></label>
     <button type="button" data-v56="help" aria-expanded="false">ℹ️ 使用说明</button>
    </div><div class="v56-info" id="v56-help" hidden><strong>新版说明：</strong>12关、动物故事、8大主题阅读、12个故事任务、每日15词与复习仓库均已保留。学习记录只存在本设备当前浏览器，打开无痕模式或清理站点数据会影响进度。切换到新浏览器前请点击“备份进度”，然后用“恢复记录”导入。此前精简在线版的记录会随备份一并保存，但无法自动换算成完整V5.6的60分关卡成绩。英语点读需浏览器支持系统语音。</div>`);
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-v56]');if(!b)return;
    if(b.dataset.v56==='export')exportSave();
    if(b.dataset.v56==='help'){const panel=document.getElementById('v56-help');panel.hidden=!panel.hidden;b.setAttribute('aria-expanded',String(!panel.hidden));}
  });
  const file=document.getElementById('v56-file');
  file?.addEventListener('change',async e=>{
    const f=e.target.files?.[0];if(!f)return;
    try{if(f.size>10*1024*1024)throw Error('文件过大，请选择英语岛备份 JSON');
      const p=JSON.parse(await f.text());importState(p);alert('学习记录恢复成功，当前浏览器已保存。');
    }catch(err){alert('恢复失败：'+err.message);}finally{file.value='';}
  });
  document.title='英语岛大冒险 V5.6 · 完整在线修复版';
})();
</script>

 else{correct=normalize(answer)===normalize(w.w);expected=w.w;explain='正确拼写是 '+w.w+'。放回句子读一遍：'+w.example;}

  vxSave();
 }else if(vxData.alloc[today].length>V57_DAILY_NEW){
  const overflow=vxData.alloc[today].slice(V57_DAILY_NEW);
  vxData.pending=Array.from(new Set([...(vxData.pending||[]),...overflow]));
  vxData.alloc[today]=vxData.alloc[today].slice(0,V57_DAILY_NEW);
  vxSave();
 }
 return vxData.alloc[today].filter(id=>VX_BY_ID[id]);
};
vxTodayCount=function(){const day=v57WeekKeyNow();return vxToday().filter(id=>{const p=Number(vxData.records[id]?.passedAt||0);return p&&v57DateKey(p)===day}).length};
vxFinishWord=function(id,correct){
 const r=vxRec(id);r.seen++;r.learned=true;
 if(correct){r.correct++;r.stage=Math.max(r.stage||0,1);r.next=Date.now()+VX_MS;if(!r.passedAt)r.passedAt=Date.now();}
 else{r.mistakes++;r.stage=0;r.next=Date.now()+VX_MS;}
 vxData.records[id]=r;vxData.history=[...new Set([...vxData.history,localDay()])].slice(-200);
 if(correct){state.stars=(state.stars||0)+1;state.petXP[UNITS[0].id]=(state.petXP[UNITS[0].id]||0)+1;markDay();save();}
 vxSave();
};
vxCorrectReview=function(id,correct){
 const r=vxRec(id);r.seen++;r.learned=true;
 if(correct){r.correct++;r.stage=Math.min(4,(r.stage||0)+1);r.next=Date.now()+([1,3,7,14][Math.min(r.stage-1,3)]||1)*VX_MS;if(!r.passedAt)r.passedAt=Date.now();}
 else{r.mistakes++;r.stage=0;r.next=Date.now()+VX_MS;}
 vxData.records[id]=r;vxData.reviewCount++;vxData.history=[...new Set([...vxData.history,localDay()])].slice(-200);vxSave();
};
vxStart=function(kind){
 if(vxRun){vxPaused=false;view='mine';session=null;render();return;}
 const ids=kind==='review'?vxDue().slice(0,V57_DAILY_REVIEW):vxToday().filter(id=>!vxData.records[id]?.learned);
 if(!ids.length){alert(kind==='review'?'目前没有到期词汇。可以先完成今天的新词任务。':'今天安排的新词已学完；答错的词会在到期后进入复习。');return;}
 vxRun={kind,ids,i:0,phase:0,selected:[],response:null,mistake:false,done:0,guideVersion:'v57'};
 vxPaused=false;vxSave();view='mine';session=null;render();window.scrollTo({top:0,behavior:'instant'});
};

 out+='<div class="section"><h2>💎 今天的10块新词矿石</h2><span class="sub">四步全部过关才点亮</span></div><div class="vx-oregrid">'+today.map((id,i)=>{const w=VX_BY_ID[id],rec=vxData.records[id]||{},passed=rec.passedAt&&v57DateKey(rec.passedAt)===v57WeekKeyNow()&&v57DateKey(rec.passedAt)===localDay();return '<div class="vx-ore '+(passed?'done':rec.learned?'':'active')+'"><span class="stone">'+(passed?'💎':rec.learned?'🔁':'🪨')+'</span><span class="label">'+(passed?esc(w.w):rec.learned?'待复习':'新词 '+(i+1))+'</span></div>'}).join('')+'</div>';
 out+='<section class="vx-card"><h3>🧠 四步引导记忆法</h3><div class="v57-guide"><strong>1. 听音认义</strong><p>听发音、看中文、想一个生活画面。</p><strong>2. 找词语伙伴</strong><p>通过同主题、反义词、常见搭配或相似词形建立联系。</p><strong>3. 看句子里的工作</strong><p>先理解一个词是在起名字、表示动作、描述样子，还是表示位置和连接；暂时不要求背语法术语。</p><strong>4. 遮住单词再拼写</strong><p>先凭记忆找回单词，再放回例句中读一遍。</p></div><p class="vx-note">每个词完成四步且全部正确，或之后在复习中成功补过关，才计入本周50个不同单词。</p></section>';
 const learned=VX_WORDS.filter(w=>vxData.records[w.id]?.learned).slice(-80).reverse();
 out+='<section class="vx-card"><h3>📖 词汇收藏与联系地图</h3><p class="vx-note">这里显示已接触词汇的意思、它在句子里的工作，以及一个可联想的词语伙伴。</p><div class="vx-library-grid">'+(learned.map(w=>{const rel=v57Relation(w),role=v57Role(w);return '<div class="vx-library-cell"><b>'+esc(w.w)+'</b><small>'+esc(w.cn)+'</small><span class="v57-library-note">'+esc(role.label)+' · '+esc(rel.kind)+'：'+esc(rel.answer)+'</span><button class="btn soft" data-vx="speak" data-text="'+attr(w.w)+'">🔊</button></div>'}).join('')||'<div class="vx-note">完成第一个单词后，这里会出现你的词汇收藏。</div>')+'</div></section>';
 out+='<div class="cheer" style="margin-top:15px">📅 推荐节奏：每周50个不同单词；每天10个新词 + 最多5个到期复习。周末重点复习错词和容易混淆的词。</div>';
 return out;
};
